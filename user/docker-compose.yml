version: '3.8'

services:
  user-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcmus-user-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3210:3210"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3210"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
